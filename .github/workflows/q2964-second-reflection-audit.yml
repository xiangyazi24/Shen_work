name: q2964-second-reflection-audit
on:
  push:
    branches: [q2964-second-reflection-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Q2964 audit
        run: python3 scripts/q2964_second_reflection_audit.py
