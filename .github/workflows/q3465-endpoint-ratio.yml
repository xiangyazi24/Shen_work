name: q3465-endpoint-ratio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Q3465 audit
        run: python3 -u scripts/q3465_endpoint_ratio_audit.py
