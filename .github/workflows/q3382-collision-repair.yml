name: q3382-collision-repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xiangyazi24/zinan-memory
          path: zinan-memory
      - name: Run Q3382 diagnostic
        run: python3 -u scripts/q3382_diag.py
