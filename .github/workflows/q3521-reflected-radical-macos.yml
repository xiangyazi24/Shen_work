name: q3521-reflected-radical-macos
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Q3521 audit
        run: python3 -u scripts/q3521_reflected_radical_audit.py
